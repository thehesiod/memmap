name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift test
      - run: scripts/bundle.sh
      - name: Publish the app to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ditto -c -k --keepParent memmap.app "memmap-${TAG}.zip"
          gh release create "$TAG" "memmap-${TAG}.zip" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
